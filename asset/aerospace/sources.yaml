# 航天板块专属信源（自动与 _default/sources.yaml 的通用财经源合并）
#
# 改完请跑 npm run scan:dry -- aerospace 确认能抓到内容。

sources:
  - name: "SpaceNews"
    type: rss
    url: "https://spacenews.com/feed/"
    maxItems: 8

  - name: "Spaceflight Now"
    type: rss
    url: "https://spaceflightnow.com/feed/"
    maxItems: 8

